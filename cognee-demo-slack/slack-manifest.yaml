display_information:
  name: Cognee Demo Bot
  description: Ask and remember things via Cognee memory
  background_color: "#3AA0FF"
features:
  bot_user:
    display_name: cognee-demo
    always_online: false
  slash_commands:
    - command: /cognee-ask
      url: https://preamble-sinner-bottom.ngrok-free.dev/api/v1/slack/commands
      description: Ask Cognee's memory a question
      usage_hint: "[question]"
      should_escape: false
    - command: /cognee-digest
      url: https://preamble-sinner-bottom.ngrok-free.dev/api/v1/slack/commands
      description: Summarize this week's remembered items
      usage_hint: "[optional topic or time window]"
      should_escape: false
    - command: /cognee-remember
      url: https://preamble-sinner-bottom.ngrok-free.dev/api/v1/slack/commands
      description: Store a fact in Cognee's memory
      usage_hint: "[fact]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
